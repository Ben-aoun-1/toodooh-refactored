# hub.too-dooh.com — wedooh PAX dashboard (Node/PM2 on the HOST, port 4000). Renamed from
# wedooh.too-dooh.com 2026-06-11 (Kais's decision); public A-record → VPS (54.38.26.121) live.
# TLS via Let's Encrypt (cert for hub.too-dooh.com issued 2026-06-14; webroot renewal through the
# certbot-webroot volume + /etc/cron.d/certbot-hub). Proxy target = docker bridge gateway
# 172.18.0.1:4000 (UFW allows the bridge → 4000 only; 4000 is not internet-reachable).
# This file is mounted into the nginx container; a single-file bind mount pins the start-time
# inode, so host edits need `docker compose up -d --force-recreate nginx` (not docker cp) to apply.
server {
  listen 80;
  server_name hub.too-dooh.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://hub.too-dooh.com$request_uri; }
}
server {
  listen 443 ssl;
  server_name hub.too-dooh.com;
  ssl_certificate /etc/letsencrypt/live/hub.too-dooh.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hub.too-dooh.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 20m;

  location /socket.io/ {
    proxy_pass http://172.18.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://172.18.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache_bypass $http_upgrade;
  }
}
