# wedooh.too-dooh.com — PAX dashboard (Node/PM2 on the HOST, port 4000). First deploy 2026-06-10.
# NOTE: wedooh.com is NOT owned by us — the public name is this subdomain (A-record via Kais/OVH).
# HTTP-only; TLS rides the wedooh cutover task. Proxy target is the docker bridge
# gateway (the host); UFW allows br-2d21d84fff59 → 4000 only — 4000 is not internet-reachable.
# The running container got this file via `docker cp` (single-file bind mounts pin the
# start-time inode, so host edits don't propagate). The compose file mounts it for future
# recreates. After editing here: docker cp + nginx -t + nginx -s reload.
server {
  listen 80;
  server_name wedooh.too-dooh.com;
  client_max_body_size 20m;

  location /socket.io/ {
    proxy_pass http://172.18.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    proxy_pass http://172.18.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache_bypass $http_upgrade;
  }
}
