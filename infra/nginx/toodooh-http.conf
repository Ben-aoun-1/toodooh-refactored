# HTTP-only variant for Phase 1h-app-deploy — serves too-dooh.com on port 80 with NO TLS.
# Used while Let's Encrypt certs don't exist yet; the prod compose nginx mount points here for this
# phase and swaps back to toodooh.conf at 1h-tls (which adds the 443 servers, HSTS, www→apex, and
# the http→https redirect). Routing mirrors toodooh.conf exactly, minus the TLS/redirect/HSTS pieces.
# Verification is by Host-header curl (no DNS flip until 1h-flip):
#   curl -H "Host: too-dooh.com" http://<vps-ip>/api/health

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name too-dooh.com www.too-dooh.com;

  root /srv/toodooh/www;
  client_max_body_size 20m;

  # No HSTS on HTTP (it requires HTTPS); the rest of the minimal header set stays.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # API + better-auth (the auth catch-all is /auth/*, per auth/plugin.ts).
  location /api/ {
    proxy_pass http://api:4000;
    include /etc/nginx/proxy_common.conf;
  }
  location /auth/ {
    proxy_pass http://api:4000;
    include /etc/nginx/proxy_common.conf;
  }

  # Object-storage presign proxy. PATH-preserving (no trailing slash on proxy_pass) + HOST-preserving
  # so the path-style SigV4 signature validates at minio. The prod bucket is named `storage`, so the
  # path-style URL http://too-dooh.com/storage/<key> matches what minio receives.
  location /storage/ {
    proxy_pass http://minio:9000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
  }

  # Content-hashed static — long-lived, immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location /images/ {
    expires 30d;
    try_files $uri =404;
  }
  location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Landing SPA — apex + its client routes serve the landing index.html.
  location = / {
    try_files /index.html =404;
  }
  location = /mentions-legales {
    try_files /index.html =404;
  }
  location = /modalites-tarifaires {
    try_files /index.html =404;
  }
  location = /politique-remboursement {
    try_files /index.html =404;
  }

  # Everything else → the React app SPA fallback (app.html references its own /assets/<hash>).
  location / {
    try_files $uri /app.html;
  }
}
