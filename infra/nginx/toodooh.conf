# Single-origin reverse proxy + static serving for too-dooh.com (Phase 1h).
#   /                                   → landing SPA (infra/landing/index.html, assembled to webroot)
#   /mentions-legales|...               → landing SPA routes
#   /assets/ /images/ /fonts/           → static (merged app+landing hashed files; landing media)
#   /api/  /auth/                        → reverse-proxy to the api container (better-auth is /auth/*)
#   /storage/                           → presign proxy to minio (path- + host-preserving for SigV4)
#   everything else                     → React app SPA (app.html)
# Real-deploy verification (TLS paths exist, presign validates, SPA fallbacks) is 1h-app-deploy.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# HTTP → HTTPS. The ACME http-01 path is kept servable defensively (we use DNS-01).
server {
  listen 80;
  server_name too-dooh.com www.too-dooh.com;
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://too-dooh.com$request_uri;
  }
}

# www → apex (apex is canonical: cookie scope + cert primary + SEO).
server {
  listen 443 ssl;
  http2 on;
  server_name www.too-dooh.com;
  ssl_certificate /etc/letsencrypt/live/too-dooh.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/too-dooh.com/privkey.pem;
  return 301 https://too-dooh.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name too-dooh.com;
  ssl_certificate /etc/letsencrypt/live/too-dooh.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/too-dooh.com/privkey.pem;

  root /srv/toodooh/www;
  client_max_body_size 20m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # API + better-auth (the auth catch-all is /auth/*, per auth/plugin.ts).
  location /api/ {
    proxy_pass http://api:4000;
    include /etc/nginx/proxy_common.conf;
  }
  location /auth/ {
    proxy_pass http://api:4000;
    include /etc/nginx/proxy_common.conf;
  }

  # Object-storage presign proxy. PATH-preserving (no trailing slash on proxy_pass) + HOST-preserving
  # so the SigV4 signature (signed over host=too-dooh.com, path=/storage/<key>, path-style) validates
  # at minio. The prod bucket is named `storage`, so path-style /<bucket>/<key> == /storage/<key>.
  location /storage/ {
    proxy_pass http://minio:9000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
  }

  # Content-hashed static — long-lived, immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location /images/ {
    expires 30d;
    try_files $uri =404;
  }
  location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Landing SPA — apex + its client routes serve the landing index.html.
  location = / {
    try_files /index.html =404;
  }
  location = /mentions-legales {
    try_files /index.html =404;
  }
  location = /modalites-tarifaires {
    try_files /index.html =404;
  }
  location = /politique-remboursement {
    try_files /index.html =404;
  }

  # Everything else → the React app SPA fallback (app.html references its own /assets/<hash>).
  location / {
    try_files $uri /app.html;
  }
}
