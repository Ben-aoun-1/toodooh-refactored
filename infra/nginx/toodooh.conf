# Single-origin reverse proxy + static serving for too-dooh.com (Phase 1h).
#   /                                   → landing SPA (infra/landing/index.html, assembled to webroot)
#   /mentions-legales|...               → landing SPA routes
#   /assets/ /images/ /fonts/           → static (merged app+landing hashed files; landing media)
#   /api/  /auth/                        → reverse-proxy to the api container (better-auth is /auth/*)
#   /storage/                           → presign proxy to minio (path- + host-preserving for SigV4)
#   everything else                     → React app SPA (app.html)
# Real-deploy verification (TLS paths exist, presign validates, SPA fallbacks) is 1h-app-deploy.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# HTTP → HTTPS. The ACME http-01 path is kept servable defensively (we use DNS-01).
server {
  listen 80;
  server_name too-dooh.com www.too-dooh.com;
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://too-dooh.com$request_uri;
  }
}

# www → apex (apex is canonical: cookie scope + cert primary + SEO).
server {
  listen 443 ssl;
  http2 on;
  server_name www.too-dooh.com;
  ssl_certificate /etc/letsencrypt/live/too-dooh.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/too-dooh.com/privkey.pem;
  return 301 https://too-dooh.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name too-dooh.com;
  ssl_certificate /etc/letsencrypt/live/too-dooh.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/too-dooh.com/privkey.pem;

  root /srv/toodooh/www;
  client_max_body_size 20m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'self'" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # DOC-CAST1 — the signup carries its documents in ONE multipart body: a screencaster may attach
  # 2 RNE + 10 documents complémentaires, and each file is capped at 5 MB (api lib/user-documents.ts
  # CATEGORY_CAPS + MAX_DOCUMENT_BYTES), so the RULED maximum is 60 MB in a single request. Under the
  # server-level `client_max_body_size 20m` nginx answers its OWN HTML 413 before Fastify sees a byte
  # and NO account is created — a regression on the very flow DOC-CAST1 fixes (a screencaster used to
  # post plain JSON and always signed up, silently losing the files). 64m = the 60 MB of files plus
  # the payload field and the multipart framing.
  # This raises only what nginx will FORWARD: the per-file 5 MB cap stays the api's (multipart
  # fileSize → PAYLOAD_TOO_LARGE) and the part count stays the route's (→ TOO_MANY_FILES).
  # An `=` match wins over the `location /api/` prefix below regardless of order, and this block
  # declares no add_header, so it still inherits the four server-level security headers (same
  # inheritance rule as /api/ — see the note on /assets/ below).
  location = /api/signup {
    client_max_body_size 64m;
    proxy_pass http://api:4000;
    include /etc/nginx/proxy_common.conf;
  }

  # API + better-auth (the auth catch-all is /auth/*, per auth/plugin.ts).
  location /api/ {
    proxy_pass http://api:4000;
    include /etc/nginx/proxy_common.conf;
  }
  location /auth/ {
    proxy_pass http://api:4000;
    include /etc/nginx/proxy_common.conf;
  }

  # TV playout WebSocket (persistent; screens hold the socket open).
  # proxy_common.conf is NOT included here: it sets `Connection ""`,
  # which would break the upgrade.
  location /ws/screen {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Object-storage presign proxy. PATH-preserving (no trailing slash on proxy_pass) + HOST-preserving
  # so the SigV4 signature (signed over host=too-dooh.com, path=/storage/<key>, path-style) validates
  # at minio. The prod bucket is named `storage`, so path-style /<bucket>/<key> == /storage/<key>.
  location /storage/ {
    proxy_pass http://minio:9000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
  }

  # Content-hashed static — long-lived, immutable.
  # ⚠️ Same nginx inheritance rule as `location /` below: a location that declares ANY add_header
  # stops inheriting the server-level ones. /assets/ and /fonts/ declare Cache-Control, so they
  # must re-declare the four security headers too — without them these locations served ZERO
  # (measured). /images/ and /downloads/ declare none and inherit all four, so they stay bare.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    try_files $uri =404;
  }
  location /images/ {
    expires 30d;
    try_files $uri =404;
  }
  location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    try_files $uri =404;
  }

  # TV app APK — the /apptv page's download contract (APPTV-1). Binary lives OUTSIDE the
  # rsync-managed webroot (the deploy rsyncs www/ with --delete).
  location /downloads/ {
    alias /srv/toodooh/apk/;
    try_files $uri =404;
  }

  # Landing SPA — apex + its client routes serve the landing index.html.
  location = / {
    try_files /index.html =404;
  }
  location = /mentions-legales {
    try_files /index.html =404;
  }
  location = /modalites-tarifaires {
    try_files /index.html =404;
  }
  location = /politique-remboursement {
    try_files /index.html =404;
  }

  # Everything else → the React app SPA fallback (app.html references its own /assets/<hash>).
  # The shell must NOT be cached: it is served from an unhashed URL, so a cached copy keeps
  # pointing at the previous deploy's /assets/<hash> and a stale app survives a deploy.
  # Hashed /assets/ and /fonts/ keep their immutable 1y cache — they are content-addressed.
  #
  # ⚠️ nginx inheritance: add_header directives are inherited from the server block ONLY IF
  # the location declares none of its own. Declaring Cache-Control here therefore DROPS the
  # four server-level security headers for every SPA response, so they are re-declared below.
  # Do not delete them thinking they are duplicates — removing them un-sets them here.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    try_files $uri /app.html;
  }
}
