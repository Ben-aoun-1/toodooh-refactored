services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: toodooh
      POSTGRES_PASSWORD: toodooh
      POSTGRES_DB: toodooh_dev
    ports:
      - '5432:5432'
    volumes:
      - toodooh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U toodooh -d toodooh_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO withdrew its public images (Docker Hub 2026-09-12, quay.io 2026-09-24): Chainguard's
    # source-built MinIO, pinned by digest (RELEASE.2026-09-22T19-25-18Z) — the same image as CI.
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - toodooh_miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  toodooh_pgdata:
  toodooh_miniodata:
