# Production stack for too-dooh.com. Secrets live in a sibling .env on the VPS (mode 0600,
# deploy-user-owned, NOT in git). Only nginx publishes ports; postgres/minio/api stay on the
# internal bridge. Runtime correctness (build, migrate, presign proxy) is proven at 1h-app-deploy.
services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  minio:
    # quay.io since 2026-09-12: Docker Hub denies this tag (« pull access denied »), same release on
    # MinIO's own registry. Changing the image NAME makes compose recreate the container once (the
    # data volume is untouched) — expect a few seconds of object-storage downtime at that deploy.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data # console (:9001) intentionally not published — reach via SSH tunnel
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      # `.` (not `..`): on the VPS the deploy rsyncs flat into /srv/toodooh/ (apps/ + the root pnpm
      # files alongside this compose file), so the build context is the compose dir itself. Do NOT
      # `docker compose build` this file from the repo's infra/ dir — context resolution differs from
      # the flat VPS layout (the repo dev stack is infra/docker-compose.yml, unaffected).
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    # UPL-4 — a hard memory ceiling for the api container. It runs node, the chromium report
    # renderer and up to two ffmpeg WebP decodes (each ≤ 128 MB at the 4K pixel budget); a runaway
    # child is OOM-killed inside this cgroup instead of starving postgres, minio and the hub on the
    # same box (11.4 GiB; the api idles at ~85 MiB, measured 2026-09-17). Swap is capped to the same
    # value so the limit cannot be sidestepped by swapping.
    mem_limit: 2g
    memswap_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # TLS apex vhost (443 + HSTS + http→https + www→apex). REQUIRES the cert at
      # /etc/letsencrypt/live/too-dooh.com/ to exist BEFORE this is mounted, or nginx fails to
      # load and the whole stack (app + hub) goes down. The HTTP-only fallback for the pre-cert
      # window is ./nginx/toodooh-http.conf (it serves the app on :80 + the ACME challenge).
      - ./nginx/toodooh.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
      # wedooh.too-dooh.com server block (host PM2 app via bridge gateway) — added 2026-06-10
      - ./nginx/wedooh.conf:/etc/nginx/conf.d/wedooh.conf:ro
      - ./www:/srv/toodooh/www:ro
      - /srv/toodooh/apk:/srv/toodooh/apk:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    networks: [internal]

volumes:
  pgdata: {}
  miniodata: {}
  certbot-webroot: {}

networks:
  internal: {}
