# CI — automated verification of the four gates on every push to main and every PR.
#
# Baseline-gated gates (typecheck, lint): the cleanup phase handed off to CI with
# accepted, deferred debt blocked on the Phase-1 Supabase typed client (issue #15).
# CI therefore verifies "no regression past the committed baseline", not "exit 0".
# A gate fails when the error count EXCEEDS its baseline, and emits a ::notice::
# (without failing) when the count drops BELOW it — prompting a manual ratchet-down
# of the constant here. Current baselines: typecheck api 0 / web 14 (per package —
# see the Typecheck step for why a single combined count is unsafe), lint 0.
# The web typecheck baseline drops to 0 when #15 lands.
# See docs/audit.md §5 row 13 and issue #11.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Phase 1b Commit 3: integration tests (apps/api/tests/signup.test.ts) need a
    # real Postgres. AUTH_SECRET is a throwaway CI value; BETTER_AUTH_URL uses its
    # env default. The web/api unit suites ignore DATABASE_URL.
    env:
      DATABASE_URL: postgresql://toodooh:toodooh@localhost:5432/toodooh_test
      AUTH_SECRET: ci-auth-secret-at-least-32-characters-long
      SMTP_USER: ci@too-dooh.com
      SMTP_PASSWORD: ci-smtp-password
      SMTP_FROM: no-reply@too-dooh.com
      # MinIO storage (Commit 2) — STORAGE_BUCKET/REGION use env.ts defaults. The
      # accessKey/secretKey match the MINIO_ROOT_* of the docker-run step below.
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: ci-minio-root
      STORAGE_SECRET_KEY: ci-minio-secret
      # CI dummy, NOT a real key (env.ts requires base64 → exactly 32 bytes; prod's
      # real key lives only in the VPS .env, provisioned by the operator).
      WIFI_ENC_KEY: bdGZPH/rQXdJWSrMWJjkoNVf2znhj3TcNJw7+rUL56k=
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: toodooh
          POSTGRES_PASSWORD: toodooh
          POSTGRES_DB: toodooh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toodooh -d toodooh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (baseline-gated, per package)
        run: |
          # GATE1 (2026-07-30) — this gate is PER PACKAGE because a single combined count
          # does not merely under-report, it INVERTS. The old step ran the root recursive
          # `pnpm typecheck`, which BAILS at the first failing package
          # (ERR_PNPM_RECURSIVE_RUN_FIRST_FAIL): apps/api's tsc always finishes first, so
          # any api failure killed apps/web's tsc before it could report its 14 — LOWERING
          # the count. Measured on this repo: api broken with 2 errors → root count 2 →
          # "2 <= 14" → GREEN. Breaking the api made the gate greener. Evidence in the log
          # trail: 45fdf79 counted 14 (api 0 + web 14), a9378f1 counted 6 (api's 6, web
          # killed), 93146ad counted 29 (api 6 + 23, web killed — never "15 + web's 14").
          #
          # Each package is therefore counted separately against its own baseline, using
          # the package's own typecheck script — the exact commands a developer runs:
          #   apps/api → tsc --noEmit -p tsconfig.test.json   (tests INCLUDED; bare
          #              `tsc --noEmit` resolves the source-only project and reports 0
          #              while test files are broken — that blind spot is what hid EV5's 6)
          #   apps/web → tsc --noEmit -p tsconfig.app.json
          API_TYPECHECK_BASELINE=0    # cleared at GATE1 (EV5's 6 inject-helper errors fixed). Keep it 0.
          WEB_TYPECHECK_BASELINE=14   # react-leaflet in /admin-zones + wizard Step4, file-saver, the dooh
                                      # engine, the database.types propagation — all clear at the last
                                      # Supabase removal (#15), when this drops to 0 too.
          fail=0
          gate() {
            pkg=$1; filter=$2; baseline=$3
            pnpm --filter "$filter" typecheck 2>&1 | tee "typecheck-$pkg.log" || true
            n=$(grep -c 'error TS' "typecheck-$pkg.log" || true)
            echo "$pkg typecheck errors: $n (baseline $baseline)"
            if [ "$n" -gt "$baseline" ]; then
              echo "::error::$pkg typecheck regressed — $n errors > baseline $baseline"
              fail=1
            elif [ "$n" -lt "$baseline" ]; then
              echo "::notice::$pkg typecheck improved — $n < $baseline; ratchet the $pkg baseline down in .github/workflows/ci.yml"
            fi
          }
          gate api @toodooh/api "$API_TYPECHECK_BASELINE"
          gate web @toodooh/web "$WEB_TYPECHECK_BASELINE"
          [ "$fail" -eq 0 ]

      - name: Lint (baseline-gated)
        run: |
          # Lint baseline is 0 (ratcheted from 1): the dangling src/lib/supabase.ts → './database.types'
          # import (a phantom file — never in-repo) was removed at the lazy-proxy fix; lint is clean.
          LINT_BASELINE=0
          pnpm lint 2>&1 | tee lint.log || true
          n=$(grep -oE '[0-9]+ error' lint.log | head -1 | grep -oE '^[0-9]+' || true)
          n=${n:-0}
          echo "lint errors: $n (baseline $LINT_BASELINE)"
          if [ "$n" -gt "$LINT_BASELINE" ]; then
            echo "::error::lint regressed — $n errors > baseline $LINT_BASELINE"
            exit 1
          elif [ "$n" -lt "$LINT_BASELINE" ]; then
            echo "::notice::lint improved — $n < $LINT_BASELINE; ratchet LINT_BASELINE down in .github/workflows/ci.yml"
          fi

      - name: Migrate (integration DB)
        run: pnpm --filter @toodooh/api migrate

      # MinIO can't be a `services:` block — it needs the `server /data` command and
      # GHA service syntax has no command/args key. A docker-run step keeps the same
      # pinned image as docker-compose, reachable at localhost:9000 like a service.
      - name: Start MinIO (S3-compatible storage for integration tests)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio-root \
            -e MINIO_ROOT_PASSWORD=ci-minio-secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            if curl -fs http://localhost:9000/minio/health/live; then echo "minio ready"; break; fi
            sleep 1
          done

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
