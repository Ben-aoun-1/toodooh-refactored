# Deploy — deliberate production deploy to the VPS, on `workflow_dispatch` or a `v*` tag (NEVER on
# push to main). It does NOT re-run the gates: it REQUIRES that ci.yml has already passed on the
# exact commit being deployed (DEPLOY-GATE1, 2026-09-11). Before that change this job re-ran
# typecheck + lint + migrate + MinIO + the full test suite on a sha CI had already verified — ~9
# of its ~10 minutes — and carried a typecheck baseline (26) that had drifted from ci.yml's.
# Now: verify CI → build → assemble the single-origin webroot → rsync → compose up → smoke. ~3 min.
# There is deliberately NO way to skip the CI check; ci.yml is the gate of record.
#
# Input (manual runs only):
#   dry_run   build + assemble, then STOP before touching the VPS — exercises this workflow
#             without deploying (run it after editing this file).
# The .env and persistent volumes live on the VPS and are never synced.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and assemble only — do not rsync or restart anything on the VPS'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Require a green CI run on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ci.yml runs on every push to main and every PR. We deploy commit $GITHUB_SHA, so we
          # look for ci.yml runs whose head_sha IS that commit (a PR run on a different head sha
          # does not count — a squash-merge produces a new sha, and main's own run is the gate of
          # record). A run still in progress is waited for (up to ~25 min); none → fail.
          sha="$GITHUB_SHA"
          echo "commit under deploy: $sha"
          for attempt in $(seq 1 100); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=20" \
                     --jq '[.workflow_runs[] | {id: .id, status: .status, conclusion: .conclusion, event: .event}]')
            count=$(echo "$runs" | jq 'length')
            if [ "$count" -eq 0 ]; then
              echo "::error::no CI run exists for $sha — push it (or open a PR) and let ci.yml pass first"
              exit 1
            fi
            if echo "$runs" | jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' >/dev/null; then
              echo "CI passed on $sha:"; echo "$runs" | jq -c '.[] | select(.conclusion == "success")'
              exit 0
            fi
            if echo "$runs" | jq -e 'any(.[]; .status != "completed")' >/dev/null; then
              echo "CI still running on $sha (attempt $attempt) — waiting 15 s"; sleep 15; continue
            fi
            echo "::error::CI did not pass on $sha:"; echo "$runs" | jq -c '.[]'
            exit 1
          done
          echo "::error::timed out waiting for CI on $sha"; exit 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Assemble single-origin webroot
        run: |
          mkdir -p www/assets
          cp -r infra/landing/. www/                 # landing index.html + assets + images + fonts + robots
          cp -r apps/web/dist/assets/. www/assets/    # merge app hashed assets alongside landing's
          cp apps/web/dist/index.html www/app.html    # app SPA entry (renamed; refs its own /assets/<hash>)
          # collision-verify: no duplicate basenames across the merged assets dir
          dupes=$(find www/assets -type f -printf '%f\n' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::asset filename collision in merged webroot:"; echo "$dupes"; exit 1
          fi

      - name: Dry run — stop before the VPS
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "dry_run=true — built and assembled $(find www -type f | wc -l) files for ${GITHUB_SHA}; nothing sent to the VPS"
          echo "DRY_RUN=1" >> "$GITHUB_ENV"

      - name: Set up SSH
        if: ${{ env.DRY_RUN != '1' }}
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Rsync artifacts to the VPS
        if: ${{ env.DRY_RUN != '1' }}
        run: |
          rsync -az --delete \
            www \
            infra/docker-compose.prod.yml \
            infra/nginx \
            apps \
            package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/toodooh/"

      - name: Deploy (compose up)
        if: ${{ env.DRY_RUN != '1' }}
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'cd /srv/toodooh && docker compose -f docker-compose.prod.yml up -d --build'

      - name: Smoke check (retry up to 60s for api boot)
        if: ${{ env.DRY_RUN != '1' }}
        run: |
          # `compose up -d` returns before the api finishes migrate-on-start + boot (~10-30s), so a
          # single immediate curl false-fails (the stack is healthy, the timing is wrong). Retry up
          # to 30×2s; on exhaustion emit the full response (headers + body) for diagnosis instead of
          # a bare non-zero exit.
          for i in $(seq 1 30); do
            if ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
                 'curl -fsS -H "Host: too-dooh.com" http://127.0.0.1/api/health' >/dev/null 2>&1; then
              echo "Smoke OK (attempt $i, $(( (i - 1) * 2 ))s elapsed)"
              exit 0
            fi
            sleep 2
          done
          echo "Smoke FAILED after 60s — full response for diagnosis:"
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'curl -i -H "Host: too-dooh.com" http://127.0.0.1/api/health' || true
          exit 1
