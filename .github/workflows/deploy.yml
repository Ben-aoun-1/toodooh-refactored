# Deploy — deliberate, gated production deploy to the VPS. Triggered by a `v*` tag or manually
# (NOT every push to main). Runs the same four gates as ci.yml, then builds, assembles the
# single-origin webroot (landing + app), rsyncs the artifacts to the VPS deploy user, and brings
# the compose stack up. The .env and persistent volumes live on the VPS and are never synced.
#
# NOTE: this workflow's gate steps mirror ci.yml inline (two workflows → readable duplication;
# factor into a reusable workflow when a third appears). The deploy steps are exercised for real
# at 1h-app-deploy — until the VPS is bootstrapped + the secrets set, this is a drafted artifact.

name: Deploy

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://toodooh:toodooh@localhost:5432/toodooh_test
      AUTH_SECRET: ci-auth-secret-at-least-32-characters-long
      SMTP_USER: ci@too-dooh.com
      SMTP_PASSWORD: ci-smtp-password
      SMTP_FROM: no-reply@too-dooh.com
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: ci-minio-root
      STORAGE_SECRET_KEY: ci-minio-secret
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: toodooh
          POSTGRES_PASSWORD: toodooh
          POSTGRES_DB: toodooh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toodooh -d toodooh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (baseline-gated)
        run: |
          TYPECHECK_BASELINE=33
          pnpm typecheck 2>&1 | tee typecheck.log || true
          n=$(grep -c 'error TS' typecheck.log || true)
          echo "typecheck errors: $n (baseline $TYPECHECK_BASELINE)"
          if [ "$n" -gt "$TYPECHECK_BASELINE" ]; then
            echo "::error::typecheck regressed — $n errors > baseline $TYPECHECK_BASELINE"
            exit 1
          fi

      - name: Lint (baseline-gated)
        run: |
          LINT_BASELINE=0 # ratcheted from 1 — the dangling supabase.ts → ./database.types import was removed
          pnpm lint 2>&1 | tee lint.log || true
          n=$(grep -oE '[0-9]+ error' lint.log | head -1 | grep -oE '^[0-9]+' || true)
          n=${n:-0}
          echo "lint errors: $n (baseline $LINT_BASELINE)"
          if [ "$n" -gt "$LINT_BASELINE" ]; then
            echo "::error::lint regressed — $n errors > baseline $LINT_BASELINE"
            exit 1
          fi

      - name: Migrate (integration DB)
        run: pnpm --filter @toodooh/api migrate

      - name: Start MinIO (S3-compatible storage for integration tests)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio-root \
            -e MINIO_ROOT_PASSWORD=ci-minio-secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            if curl -fs http://localhost:9000/minio/health/live; then echo "minio ready"; break; fi
            sleep 1
          done

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Assemble single-origin webroot
        run: |
          mkdir -p www/assets
          cp -r infra/landing/. www/                 # landing index.html + assets + images + fonts + robots
          cp -r apps/web/dist/assets/. www/assets/    # merge app hashed assets alongside landing's
          cp apps/web/dist/index.html www/app.html    # app SPA entry (renamed; refs its own /assets/<hash>)
          # collision-verify: no duplicate basenames across the merged assets dir
          dupes=$(find www/assets -type f -printf '%f\n' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::asset filename collision in merged webroot:"; echo "$dupes"; exit 1
          fi

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Rsync artifacts to the VPS
        run: |
          rsync -az --delete \
            www \
            infra/docker-compose.prod.yml \
            infra/nginx \
            apps \
            package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/toodooh/"

      - name: Deploy (compose up)
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'cd /srv/toodooh && docker compose -f docker-compose.prod.yml up -d --build'

      - name: Smoke check
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'curl -fsS -H "Host: too-dooh.com" http://127.0.0.1/api/health && echo OK'
